name: Bug report
description: Report a reproducible problem in the analysis or tooling.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the notebook, cell, command, and relevant parameters.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python/R/package versions.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share concise logs, excluding credentials and sensitive data.
